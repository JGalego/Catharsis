[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catharsis-lang"
version = "0.1.0"
description = "Catharsis: an esoteric language in which emotion is the computational substrate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JGalego" }]
keywords = ["esolang", "emotion", "agents", "simulation", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JGalego/Catharsis"
Source = "https://github.com/JGalego/Catharsis"

[project.scripts]
catharsis = "catharsis.cli:main"

[tool.setuptools]
packages = ["catharsis"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
