name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Run every example
        run: |
          for program in examples/*.feel; do
            echo "== $program"
            python -m catharsis run "$program" --quiet
            python -m catharsis visualize "$program" -o /tmp/out.html
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check catharsis tests
      - run: ruff format --check catharsis tests
